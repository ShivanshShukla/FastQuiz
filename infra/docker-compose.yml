services:
  # ============================================================================
  # Databases & Message Brokers
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fastquiz-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastquiz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: fastquiz-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fastquiz_questions
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastquiz-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fastquiz-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"     # AMQP protocol
      - "15672:15672"   # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ============================================================================
  # Microservices
  # ============================================================================
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: fastquiz-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: auth-service
      ENVIRONMENT: development
      PORT: 8001
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fastquiz
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-change-in-production-12345
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  quiz-service:
    build:
      context: ../services/quiz-service
      dockerfile: Dockerfile
    container_name: fastquiz-quiz-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: quiz-service
      ENVIRONMENT: development
      PORT: 8002
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fastquiz
      MONGODB_URI: mongodb://mongodb:27017/fastquiz_questions
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  payments-service:
    build:
      context: ../services/payments-service
      dockerfile: Dockerfile
    container_name: fastquiz-payments-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      SERVICE_NAME: payments-service
      ENVIRONMENT: development
      PORT: 8003
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fastquiz
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
