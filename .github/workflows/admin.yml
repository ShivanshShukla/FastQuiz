name: Admin App CI

on:
  push:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/shared/**"
      - ".github/workflows/admin.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/admin/**"
      - "packages/shared/**"
      - ".github/workflows/admin.yml"

jobs:
  build:
    name: Lint, Type Check & Build Admin App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@fastquiz/shared

      - name: Type Check Admin
        run: npm run typecheck --workspace=@fastquiz/admin

      - name: Run Admin Tests
        run: npm run test --workspace=@fastquiz/admin

      - name: Build Admin Application
        run: npm run build --workspace=@fastquiz/admin
