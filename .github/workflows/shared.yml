name: Shared Package CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/shared/**'
      - '.github/workflows/shared.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/shared/**'
      - '.github/workflows/shared.yml'

jobs:
  test:
    name: Type Check & Build Shared Library
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck --workspace=@fastquiz/shared

      - name: Build Shared Package
        run: npm run build --workspace=@fastquiz/shared
