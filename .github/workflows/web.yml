name: Web App CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/web.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - ".github/workflows/web.yml"

jobs:
  build:
    name: Lint, Type Check & Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@fastquiz/shared

      - name: Type Check Web
        run: npm run typecheck --workspace=@fastquiz/web

      - name: Run Web Tests
        run: npm run test --workspace=@fastquiz/web

      - name: Build Web Application
        run: npm run build --workspace=@fastquiz/web
