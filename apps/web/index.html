<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="FastQuiz — The high-momentum interview prep platform for software engineers."
    />
    <!-- Typography & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <title>FastQuiz — Interview prep</title>
  </head>
  <body
    class="bg-background text-on-surface antialiased selection:bg-primary/30 selection:text-white min-h-screen"
  >
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #09090b;
          color: #f4f4f5;
          font-family:
            -apple-system, BlinkMacSystemFont, &quot;Inter&quot;, sans-serif;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
          "
        >
          <div
            style="
              width: 32px;
              height: 32px;
              border-radius: 8px;
              background: #6366f1;
              display: flex;
              align-items: center;
              justify-content: center;
            "
          >
            <svg
              style="width: 18px; height: 18px; fill: white"
              viewBox="0 0 24 24"
            >
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
          </div>
          <span
            style="font-size: 20px; font-weight: 700; letter-spacing: -0.02em"
            >Fast<span style="color: #818cf8">Quiz</span></span
          >
        </div>
        <div
          style="
            width: 140px;
            height: 3px;
            background: #27272a;
            border-radius: 9999px;
            overflow: hidden;
            margin-top: 4px;
          "
        >
          <div
            style="
              width: 50%;
              height: 100%;
              background: #6366f1;
              border-radius: 9999px;
            "
          ></div>
        </div>
        <span
          style="
            font-size: 11px;
            font-family: monospace;
            color: #71717a;
            margin-top: 14px;
            letter-spacing: 0.05em;
          "
          >INITIALIZING FASTQUIZ...</span
        >
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
