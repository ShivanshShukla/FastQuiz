services:
  # ============================================================================
  # Monitoring & Live Logs (Dozzle)
  # ============================================================================
  dozzle:
    image: amir20/dozzle:latest
    container_name: fastquiz-dozzle
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_LEVEL: info
      DOZZLE_TITLE: "FastQuiz Live Logs"
      DOZZLE_ENABLE_ACTIONS: "true"
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 16M
    labels:
      - "dev.dozzle.group=Monitoring"

  # ============================================================================
  # Datastores & Message Brokers
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: fastquiz-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastquiz
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 32M
    labels:
      - "dev.dozzle.group=Infrastructure"

  mongodb:
    image: mongo:7.0
    container_name: fastquiz-mongodb
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fastquiz_questions
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'echo ''db.runCommand("ping").ok'' | mongosh localhost:27017/test --quiet',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 64M
    labels:
      - "dev.dozzle.group=Infrastructure"

  redis:
    image: redis:7-alpine
    container_name: fastquiz-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "64mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M
        reservations:
          memory: 16M
    labels:
      - "dev.dozzle.group=Infrastructure"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fastquiz-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672" # AMQP protocol
      - "15672:15672" # Management Web UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 96M
    labels:
      - "dev.dozzle.group=Infrastructure"

  # ============================================================================
  # Backend Microservices
  # ============================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: fastquiz-auth-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - path: .env
        required: false
      - path: ./services/auth-service/.env
        required: false
    environment:
      SERVICE_NAME: auth-service
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PORT: 8001
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/fastquiz}
      REDIS_URL: ${AUTH_REDIS_URL:-redis://redis:6379/0}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M
        reservations:
          memory: 32M
    labels:
      - "dev.dozzle.group=Microservices"

  quiz-service:
    build:
      context: ./services/quiz-service
      dockerfile: Dockerfile
    container_name: fastquiz-quiz-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: quiz-service
      ENVIRONMENT: development
      PORT: 8002
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fastquiz
      MONGODB_URI: mongodb://mongodb:27017/fastquiz_questions
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 32M
    labels:
      - "dev.dozzle.group=Microservices"

  payments-service:
    build:
      context: ./services/payments-service
      dockerfile: Dockerfile
    container_name: fastquiz-payments-service
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      SERVICE_NAME: payments-service
      ENVIRONMENT: development
      PORT: 8003
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fastquiz
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 160M
        reservations:
          memory: 32M
    labels:
      - "dev.dozzle.group=Microservices"

  # ============================================================================
  # Frontend Applications
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fastquiz-web
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      auth-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    labels:
      - "dev.dozzle.group=Frontend"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        VITE_MOCK_ON: ${MOCK_ON:-true}
    container_name: fastquiz-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      auth-service:
        condition: service_healthy
      quiz-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    labels:
      - "dev.dozzle.group=Frontend"

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
